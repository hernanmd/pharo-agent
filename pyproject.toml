[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pharo-agent-ci-controller"
version = "0.1.0"
description = "Self-hosted CI controller for Ollama-powered GitHub PR review and draft fix PRs."
readme = "docs/pharo-agent-ci.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-ci-controller = "ai_ci_controller.cli:main"

[tool.setuptools.packages.find]
include = ["ai_ci_controller*"]


[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # long lines are handled by line-length, not worth churn in prompt strings
    "SIM108",  # ternaries are not always clearer than if/else here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "C408"]  # dict(**defaults) helpers read better than literals

[tool.pytest.ini_options]
testpaths = ["tests"]
