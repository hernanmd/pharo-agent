name: Pharo Agent PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: string
      dry_run:
        description: Print the review without posting a PR comment
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    runs-on: [self-hosted, pharo-agent]
    timeout-minutes: 90
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        (
          github.event.pull_request.head.repo.full_name == github.repository ||
          vars.PHARO_AGENT_ALLOW_FORKS == 'true'
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/ai review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    env:
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://127.0.0.1:11434' }}
    concurrency:
      group: pharo-agent-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: true

    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check local runner dependencies
        run: |
          command -v git
          command -v gh
          python --version
          curl -fsS "${OLLAMA_BASE_URL:-http://127.0.0.1:11434}/api/tags" >/dev/null

      - name: Review pull request
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request|pull_request_review)
              PR_NUMBER="$PULL_REQUEST_NUMBER"
              ;;
            issue_comment)
              PR_NUMBER="$ISSUE_NUMBER"
              ;;
            workflow_dispatch)
              PR_NUMBER="$DISPATCH_PR_NUMBER"
              ;;
            *)
              echo "Unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ -z "$PR_NUMBER" ]]; then
            echo "Could not determine pull request number." >&2
            exit 1
          fi

          ./scripts/ai-ci-controller review-pr --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ vars.PHARO_AGENT_MODEL_MEDIUM || vars.PHARO_AGENT_MODEL }}
          MODEL_SMALL: ${{ vars.PHARO_AGENT_MODEL_SMALL || vars.PHARO_AGENT_MODEL }}
          MODEL_MEDIUM: ${{ vars.PHARO_AGENT_MODEL_MEDIUM || vars.PHARO_AGENT_MODEL }}
          MODEL_LARGE: ${{ vars.PHARO_AGENT_MODEL_LARGE || vars.PHARO_AGENT_MODEL }}
          LINT_CMD: ${{ vars.PHARO_AGENT_LINT_CMD }}
          TEST_CMD: ${{ vars.PHARO_AGENT_TEST_CMD }}
          AI_CI_DAILY_LIMIT: ${{ vars.PHARO_AGENT_DAILY_LIMIT || '10' }}
          PHARO_AGENT_ALLOW_FORKS: ${{ vars.PHARO_AGENT_ALLOW_FORKS || 'false' }}
          AI_CI_EXTRA_CONTEXT: ${{ github.event.comment.body || github.event.review.body || '' }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PHARO_VM: ${{ vars.PHARO_VM }}
          PHARO_IMAGE: ${{ vars.PHARO_IMAGE }}
          PHARO_BASELINE: ${{ vars.PHARO_BASELINE }}
          AI_CI_AGENT_MAX_ITERATIONS: ${{ vars.PHARO_AGENT_MAX_ITERATIONS || '12' }}
          WORK_ROOT: ${{ github.workspace }}/.ai-ci-runs

          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
