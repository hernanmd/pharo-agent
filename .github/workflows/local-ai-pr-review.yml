name: Local AI PR Review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: string
      dry_run:
        description: Print the review without posting a PR comment
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    runs-on: [self-hosted, local-ai]
    env:
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://127.0.0.1:11434' }}
    concurrency:
      group: local-ai-pr-review-${{ github.repository }}-${{ inputs.pr }}
      cancel-in-progress: false

    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check local runner dependencies
        run: |
          command -v git
          command -v gh
          python --version
          curl -fsS "${OLLAMA_BASE_URL:-http://127.0.0.1:11434}/api/tags" >/dev/null

      - name: Review pull request
        run: ./scripts/ai-ci-controller review-pr --repo "$GITHUB_REPOSITORY" --pr "${{ inputs.pr }}"
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ vars.LOCAL_AI_MODEL }}
          LINT_CMD: ${{ vars.LOCAL_AI_LINT_CMD }}
          TEST_CMD: ${{ vars.LOCAL_AI_TEST_CMD }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
