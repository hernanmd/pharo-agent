name: Pharo Agent PR Autofix

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to fix
        required: true
        type: string
      dry_run:
        description: Commit locally but do not push or open a draft PR
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      base_mode:
        description: Base branch for generated fix PR
        required: false
        default: auto
        type: choice
        options:
          - auto
          - pr-head
          - target-base

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: write

jobs:
  autofix:
    runs-on: [self-hosted, pharo-agent]
    timeout-minutes: 240
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/ai fix') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    env:
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://127.0.0.1:11434' }}
    concurrency:
      group: pharo-agent-pr-autofix-${{ github.repository }}-${{ github.event.issue.number || inputs.pr }}
      cancel-in-progress: false

    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check local runner dependencies
        run: |
          command -v git
          command -v gh
          command -v aider
          python --version
          curl -fsS "${OLLAMA_BASE_URL:-http://127.0.0.1:11434}/api/tags" >/dev/null

      - name: Create draft fix pull request
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
            PR_NUMBER="$ISSUE_NUMBER"
            BASE_MODE="auto"
          else
            PR_NUMBER="$DISPATCH_PR_NUMBER"
            BASE_MODE="$DISPATCH_BASE_MODE"
          fi

          if [[ -z "$PR_NUMBER" ]]; then
            echo "Could not determine pull request number." >&2
            exit 1
          fi

          ./scripts/ai-ci-controller fix-pr \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --base-mode "$BASE_MODE"
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ vars.PHARO_AGENT_MODEL_MEDIUM || vars.PHARO_AGENT_MODEL }}
          MODEL_SMALL: ${{ vars.PHARO_AGENT_MODEL_SMALL || vars.PHARO_AGENT_MODEL }}
          MODEL_MEDIUM: ${{ vars.PHARO_AGENT_MODEL_MEDIUM || vars.PHARO_AGENT_MODEL }}
          MODEL_LARGE: ${{ vars.PHARO_AGENT_MODEL_LARGE || vars.PHARO_AGENT_MODEL }}
          LINT_CMD: ${{ vars.PHARO_AGENT_LINT_CMD }}
          TEST_CMD: ${{ vars.PHARO_AGENT_TEST_CMD }}
          AI_CI_DAILY_LIMIT: ${{ vars.PHARO_AGENT_DAILY_LIMIT || '10' }}
          PHARO_AGENT_ALLOW_FORKS: ${{ vars.PHARO_AGENT_ALLOW_FORKS || 'false' }}
          AI_CI_EXTRA_CONTEXT: ${{ github.event.comment.body || '' }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr }}
          DISPATCH_BASE_MODE: ${{ inputs.base_mode || 'auto' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PHARO_VM: ${{ vars.PHARO_VM }}
          PHARO_IMAGE: ${{ vars.PHARO_IMAGE }}
          PHARO_BASELINE: ${{ vars.PHARO_BASELINE }}
          AI_CI_AGENT_MAX_ITERATIONS: ${{ vars.PHARO_AGENT_MAX_ITERATIONS || '12' }}
          WORK_ROOT: ${{ github.workspace }}/.ai-ci-runs

          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
          UNATTENDED: "1"
